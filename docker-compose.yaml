services:
  bot:
    container_name: bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - private
    depends_on:
      - db
    links:
      - db
    restart: unless-stopped


  db:
    container_name: db
    image: postgres:18-alpine
    environment:
      TZ: America/New_York
      PGTZ: America/New_York
    env_file:
      - .env
    networks:
      - private
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - 5432:5432
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  private:
    external: false
